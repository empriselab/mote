services:
  dev:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    volumes:
      - ..:/workspaces/mote-core:cached
      - cargo-registry:/home/vscode/.cargo/registry
      - cargo-git:/home/vscode/.cargo/git
      - uv-cache:/home/vscode/.cache/uv
    command: sleep infinity
    # Uncomment on a native-Linux host to enable USB passthrough for firmware deployment:
    # privileged: true
    # devices:
    #   - /dev/bus/usb:/dev/bus/usb

volumes:
  cargo-registry:
  cargo-git:
  uv-cache:
