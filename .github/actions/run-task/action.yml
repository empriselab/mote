name: Run task in dev container
description: >-
  Runs a `task` command inside the repo's dev container (via devcontainers/ci),

inputs:
  run:
    description: Shell command to execute inside the dev container (e.g. `task ci`)
    required: true
  rust-cache-workspaces:
    description: Passed to Swatinem/rust-cache's `workspaces` input; step skipped if empty
    required: false
    default: ''
  npm-cache-dependency-path:
    description: Path to a package-lock.json to key the npm cache on; step skipped if empty
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Cache cargo
      if: ${{ inputs.rust-cache-workspaces != '' }}
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: ${{ inputs.rust-cache-workspaces }}

    - name: Cache uv
      uses: actions/cache@v4
      with:
        path: ~/.cache/uv
        key: uv-${{ runner.os }}-${{ hashFiles('**/uv.lock') }}
        restore-keys: |
          uv-${{ runner.os }}-

    - name: Cache npm
      if: ${{ inputs.npm-cache-dependency-path != '' }}
      uses: actions/cache@v4
      with:
        path: ~/.npm
        key: npm-${{ runner.os }}-${{ hashFiles(inputs.npm-cache-dependency-path) }}
        restore-keys: |
          npm-${{ runner.os }}-

    - name: Make cache dirs writable for the container user
      shell: bash
      run: |
        mkdir -p ~/.cargo/registry ~/.cargo/git ~/.cache/uv ~/.npm
        chmod -R a+rwX ~/.cargo/registry ~/.cargo/git ~/.cache/uv ~/.npm

    - name: Log in to GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ github.token }}

    - name: Run task in dev container
      uses: devcontainers/ci@v0.3
      with:
        configFile: .devcontainer/ci/devcontainer.json
        imageName: ghcr.io/empriselab/mote-devcontainer
        cacheFrom: ghcr.io/empriselab/mote-devcontainer
        push: filter
        env: |
          CARGO_TERM_COLOR=always
        runCmd: ${{ inputs.run }}
