name: Build Lint Format Test
description: Build, lint, format and test all code

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    shell: bash

jobs:
  build-lint-format-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
    - uses: actions/checkout@v4

    - name: Run CI validation
      uses: ./.github/actions/run-task
      with:
        run: task ci
        rust-cache-workspaces: |
          mote-firmware
          mote-api
          mote-ffi
        npm-cache-dependency-path: mote-configuration/package-lock.json
