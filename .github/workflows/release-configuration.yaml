name: Release Configuration Page

on:
  push:
    tags:
      - 'mote-configuration-v*.*.*'

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    shell: bash

jobs:
  release-configuration:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: 'npm'
          cache-dependency-path: 'mote-configuration/package-lock.json'

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: mote-ffi

      - uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: 'latest'

      - name: Install Task
        uses: go-task/setup-task@v2

      - name: Check version matches tag
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#mote-configuration-v}"
          CODE_VERSION=$(jq -r .version mote-configuration/package.json)
          if [ "$TAG_VERSION" != "$CODE_VERSION" ]; then
            echo "Error: Tag version ($TAG_VERSION) does not match package.json version ($CODE_VERSION)"
            exit 1
          fi
          echo "Version check passed: $CODE_VERSION"

      - name: Build and package
        working-directory: mote-configuration
        run: task release-package

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: mote-configuration/mote-configuration-v*.tar.gz

  redeploy-pages:
    needs: release-configuration
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Trigger pages deployment
        run: gh workflow run deploy.yaml --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
