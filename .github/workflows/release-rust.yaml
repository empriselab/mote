name: Release Rust Crate

on:
  push:
    tags:
      - 'mote-rust-v*.*.*'

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    shell: bash

jobs:
  release-rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: mote-api

      - name: Check version matches tag
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#mote-rust-v}"
          CRATE_VERSION=$(grep '^version' mote-api/Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          if [ "$TAG_VERSION" != "$CRATE_VERSION" ]; then
            echo "Error: Tag version ($TAG_VERSION) does not match crate version ($CRATE_VERSION)"
            exit 1
          fi
          echo "Version check passed: $CRATE_VERSION"

      - name: Publish to crates.io
        working-directory: mote-api
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
