[package]
name = "mote-api"
version = "0.1.0"
edition = "2024"
description = "Message and API definitions for communicating with Mote"
license = "MIT"
repository = "https://github.com/empriselab/mote"
documentation = "https://docs.rs/mote-api"
keywords = ["robotics", "embedded", "protocol", "serialization"]
categories = ["embedded", "no-std", "network-programming"]

[dependencies]
postcard = { version = "1", default-features = false, features = ["alloc"] }
# defmt = { version = "1.0", features = ["alloc"] }
serde = { version = "1.0", default-features = false, features = [
    "derive",
    "alloc",
] }
corncobs = "0.1"
thiserror = { version = "2.0", default-features = false }

schemars = { version = "1.2", optional = true }

[features]
schemars = ["dep:schemars"]

[dev-dependencies]
async-std = "1"
color_space = "0.5"
futures-util = "0.3"
mdns = "3.0"
rerun = { version = "0.30", features = ["web_viewer"] }
anyhow = "1.0"
