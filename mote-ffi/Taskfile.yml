version: '3'

tasks:
  default:
    silent: true
    cmds:
      - task --list-all

  # WASM / TS

  build-wasm:
    cmds:
      - wasm-pack build --out-dir target/pkg-node --target bundler --features wasm_ffi

  build-cxx:
    desc: "Build the C++ static library. Output: target/release/libmote_ffi.a  (headers: include/mote-ffi/src/mote_cxx.rs.h, include/rust/cxx.h)"
    cmds:
      - cargo build --release --no-default-features --features cxx_ffi

  test-wasm:
    desc: "Run the WASM binding's tests under Node (requires wasm-pack)."
    cmds:
      - wasm-pack test --node --features wasm_ffi

  # Python

  generate-python-types:
    desc: "Regenerate mote_link/_generated.py from mote-ffi's JSON schemas (schemas/*.json)."
    cmds:
      - cargo build --quiet
      # Uses only the standard library, so this doesn't need `uv run` / a synced venv --
      # safe to run before `dev-setup`'s `uv sync` on a fresh checkout.
      - python3 scripts/generate_python_types.py

  # General

  dev-setup:
    deps: [generate-python-types]
    cmds:
      - uv sync --all-extras --cache-dir .uv_cache
      - uv run maturin develop --features python_ffi

  prod-setup:
    cmds:
      - uv sync --all-extras --no-dev --cache-dir .uv_cache

  test:
    deps: [generate-python-types]
    cmds:
      - cargo test --all-features
      - task: test-wasm
      - uv run pytest

  format:
    cmds:
      - cargo fmt
      - uv --preview format

  lint:
    deps: [generate-python-types]
    cmds:
      - cmd: echo "Linting mote-api"
        silent: true
      - uv run --all-extras ty check
      - cargo clippy --all-features  -- -D warnings

  build:
    deps: [build-wasm]

  # Examples

  rerun-demo:
    deps: [dev-setup]
    cmds:
      - uv run rerun-demo

  # CI

  format-check:
    cmds:
      - cargo fmt --check
      - uv --preview format --check

  upgrade:
    desc: Upgrade locked Rust and Python dependency versions
    cmds:
      - cargo update
      - uv lock --upgrade

  ci:
    deps: [build, lint, test, format-check]

  # Release

  release-build-cxx-linux:
    desc: >-
      Build the C++ static library for Linux x86_64, natively inside a manylinux_2_28 (AlmaLinux 8,
      glibc 2.28) container with gcc-toolset-9 enabled. Output: target/release/libmote_ffi.a
    cmds:
      - |
        docker run --rm --platform linux/amd64 \
          -v "$(pwd)/..":/src -w /src/mote-ffi \
          quay.io/pypa/manylinux_2_28_x86_64 bash -c '
            set -e
            dnf install -y -q gcc-toolset-9-gcc-c++
            source /opt/rh/gcc-toolset-9/enable
            curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
            source "$HOME/.cargo/env"
            cargo build --release --no-default-features --features cxx_ffi
          '

  release-package-cxx-linux:
    desc: >-
      Build and package the C++ static library for Linux x86_64, cxx-generated headers, and schemas
      into a release tarball. Output: dist/mote-ffi-cxx-linux-x86_64-v<version>.tar.gz
    deps: [release-build-cxx-linux]
    cmds:
      - |
        VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
        mkdir -p dist dist/_pkg/include dist/_pkg/schemas
        cp target/release/libmote_ffi.a dist/_pkg/
        cp -r include/. dist/_pkg/include/
        cp schemas/*.json dist/_pkg/schemas/
        tar -czf dist/mote-ffi-cxx-linux-x86_64-v${VERSION}.tar.gz -C dist/_pkg .
        rm -rf dist/_pkg

  release-build-cxx-linux-aarch64:
    desc: >-
      Build the C++ static library for Linux aarch64. Output: target/release/libmote_ffi.a
    cmds:
      - |
        docker run --rm --platform linux/arm64 \
          -v "$(pwd)/..":/src -w /src/mote-ffi \
          quay.io/pypa/manylinux_2_28_aarch64 bash -c '
            set -e
            dnf install -y -q gcc-toolset-9-gcc-c++
            source /opt/rh/gcc-toolset-9/enable
            curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
            source "$HOME/.cargo/env"
            cargo build --release --no-default-features --features cxx_ffi
          '

  release-package-cxx-linux-aarch64:
    desc: >-
      Build and package the C++ static library for Linux aarch64, cxx-generated headers, and
      schemas into a release tarball. Output: dist/mote-ffi-cxx-linux-aarch64-v<version>.tar.gz
    deps: [release-build-cxx-linux-aarch64]
    cmds:
      - |
        VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
        mkdir -p dist dist/_pkg/include dist/_pkg/schemas
        cp target/release/libmote_ffi.a dist/_pkg/
        cp -r include/. dist/_pkg/include/
        cp schemas/*.json dist/_pkg/schemas/
        tar -czf dist/mote-ffi-cxx-linux-aarch64-v${VERSION}.tar.gz -C dist/_pkg .
        rm -rf dist/_pkg

  release-build-cxx-macos:
    desc: "Build the C++ static library for macOS (native arm64, requires macOS 12.0+). Output: target/release/libmote_ffi.a"
    cmds:
      - MACOSX_DEPLOYMENT_TARGET=12.0 cargo build --release --no-default-features --features cxx_ffi

  release-package-cxx-macos:
    desc: >-
      Build and package the C++ static library for macOS, cxx-generated headers, and schemas into
      a release tarball. Output: dist/mote-ffi-cxx-macos-aarch64-v<version>.tar.gz
    deps: [release-build-cxx-macos]
    cmds:
      - |
        VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
        mkdir -p dist dist/_pkg/include dist/_pkg/schemas
        cp target/release/libmote_ffi.a dist/_pkg/
        cp -r include/. dist/_pkg/include/
        cp schemas/*.json dist/_pkg/schemas/
        tar -czf dist/mote-ffi-cxx-macos-aarch64-v${VERSION}.tar.gz -C dist/_pkg .
        rm -rf dist/_pkg
