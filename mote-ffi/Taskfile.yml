version: '3'

tasks:
  default:
    silent: true
    cmds:
      - task --list

  # WASM / TS

  build-wasm:
    cmds:
      - wasm-pack build --out-dir target/pkg-node --target bundler --features wasm_ffi

  build-c:
    desc: "Build the C static library. Output: target/release/libmote_ffi.a  (header: include/mote_link.h)"
    cmds:
      - cargo build --release --no-default-features --features c_ffi

  # General

  dev-setup:
    cmds:
      - uv sync --all-extras --cache-dir .uv_cache
      - uv run maturin develop --features python_ffi

  prod-setup:
    cmds:
      - uv sync --all-extras --no-dev --cache-dir .uv_cache

  test:
    cmds:
      - cargo test --all-features
      - uv run pytest

  format:
    cmds:
      - cargo fmt
      - uv format --preview-features format

  lint:
    cmds:
      - cmd: echo "Linting mote-api"
        silent: true
      - uv run ty check
      - cargo clippy --all-features  -- -D warnings

  build:
    deps: [build-wasm]

  # Examples

  rerun-demo:
    deps: [dev-setup]
    cmds:
      - uv run rerun-demo

  # CI

  format-check:
    cmds:
      - cargo fmt --check
      - uv format --check --preview-features format

  ci:
    deps: [build, lint, test, format-check]

  # Release

  release-build-c-linux:
    desc: >-
      Build the C static library for Linux using cargo-zigbuild targeting glibc 2.17 for broad
      compatibility. Requires cargo-zigbuild and zig to be installed.
      Output: target/x86_64-unknown-linux-gnu/release/libmote_ffi.a
    cmds:
      - cargo zigbuild --release --no-default-features --features c_ffi --target x86_64-unknown-linux-gnu.2.17

  release-package-c-linux:
    desc: >-
      Build and package the C static library for Linux, header, and schemas into a release
      tarball. Output: dist/mote-ffi-c-linux-x86_64-v<version>.tar.gz
    deps: [release-build-c-linux]
    cmds:
      - |
        VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
        mkdir -p dist dist/_pkg/include dist/_pkg/schemas
        cp target/x86_64-unknown-linux-gnu/release/libmote_ffi.a dist/_pkg/
        cp include/mote_link.h dist/_pkg/include/
        cp schemas/*.json dist/_pkg/schemas/
        tar -czf dist/mote-ffi-c-linux-x86_64-v${VERSION}.tar.gz -C dist/_pkg .
        rm -rf dist/_pkg

  release-build-c-macos:
    desc: "Build the C static library for macOS (native arm64, requires macOS 12.0+). Output: target/release/libmote_ffi.a"
    cmds:
      - MACOSX_DEPLOYMENT_TARGET=12.0 cargo build --release --no-default-features --features c_ffi

  release-package-c-macos:
    desc: >-
      Build and package the C static library for macOS, header, and schemas into a release
      tarball. Output: dist/mote-ffi-c-macos-aarch64-v<version>.tar.gz
    deps: [release-build-c-macos]
    cmds:
      - |
        VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
        mkdir -p dist dist/_pkg/include dist/_pkg/schemas
        cp target/release/libmote_ffi.a dist/_pkg/
        cp include/mote_link.h dist/_pkg/include/
        cp schemas/*.json dist/_pkg/schemas/
        tar -czf dist/mote-ffi-c-macos-aarch64-v${VERSION}.tar.gz -C dist/_pkg .
        rm -rf dist/_pkg
