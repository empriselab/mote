header = """
/*
 * Error convention
 *
 * Functions that can fail return either a `MoteLinkErrorCode` directly, or a
 * `MoteLinkResult` struct pairing a `MoteLinkErrorCode` with the call's data
 * (`bytes_written`). `MoteLinkErrorCode_None` (0) means success; any other
 * value means failure, and see each function's docs for what `bytes_written`
 * means in that case.
 */
"""

[export]
# Exclude `log` from wasm.rs — cbindgen parses all source files regardless of feature flags
exclude = ["log"]

[enum]
# Emit e.g. `MoteLinkErrorCode_None` instead of a bare `None`, which would
# otherwise pollute the global C namespace.
prefix_with_name = true
