[project]
name = "mote_link"
version = "0.1.0"
description = "Communicating with Mote"
readme = "mote_link/README.md"
requires-python = ">=3.8"
dependencies = [
    "zeroconf>=0.136",
    "rerun-sdk>=0.21",
    "survey>=5.4",
    "pyglet>=2.0",
]

[project.urls]
Documentation = "https://empriselab.github.io/mote/"
Repository = "https://github.com/empriselab/mote"

[project.scripts]
rerun-demo = "mote_link.examples.rerun_demo:main"

[tool.uv]
package = true

[tool.maturin]
include = ["mote_link/**/*"]
module-name = "mote_link.mote_ffi"
features = ["python_ffi"]
cargo-extra-args = "--crate-type=dylib"

[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[dependency-groups]
dev = ["ty>=0.0.18", "ruff>=0.15.2", "pytest>=8.0"]

[tool.maturin.generate-ci.github]
trusted-publishing = true
publishing-environment = "pypi"
